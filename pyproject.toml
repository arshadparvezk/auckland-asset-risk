[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auckland-asset-risk"
version = "1.3.0"
description = "Reproducible multi-hazard screening, probabilistic loss modelling and resilience economics for Auckland public assets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "matplotlib>=3.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "plotly>=5.24",
  "pyarrow>=17.0",
  "pyogrio>=0.10",
  "PyYAML>=6.0",
  "requests>=2.32",
  "shapely>=2.0",
  "streamlit>=1.62,<2",
]

[project.optional-dependencies]
dev = ["ipykernel>=6.29", "nbclient>=0.10", "nbformat>=5.10", "pytest>=8.0"]

[project.scripts]
asset-risk = "asset_risk.pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
