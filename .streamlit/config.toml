# Auckland asset-risk executive theme

[theme]
base = "light"
primaryColor = "#0B6B73"
backgroundColor = "#F7FAFB"
secondaryBackgroundColor = "#EAF1F3"
textColor = "#102A3A"
linkColor = "#0B6B73"
borderColor = "#CBD9DF"
codeBackgroundColor = "#EAF1F3"
codeTextColor = "#163747"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["34px", "25px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 650, 650, 600, 600, 600]
linkUnderline = false

greenColor = "#0F766E"
redColor = "#B42318"
yellowColor = "#B77900"
orangeColor = "#D05B15"
blueColor = "#155E75"
violetColor = "#6D5BD0"
grayColor = "#5E7180"

